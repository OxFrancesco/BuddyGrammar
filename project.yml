name: BuddyGrammar
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2442WAF29
    SPARKLE_FEED_URL: https://raw.githubusercontent.com/oxfrancesco/buddygrammar/main/appcast.xml
    SPARKLE_PUBLIC_ED_KEY: YvlMAWKQ4HQQXIVXWeRI6jCdNrnPFCywBoQNEWNIKTc=
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    revision: 8c9dd6391139242261bcf27d253c326f9cf2d567
  SwiftHuggingFaceMLX:
    url: https://github.com/DePasqualeOrg/swift-huggingface-mlx.git
    branch: main
  SwiftTransformersMLX:
    url: https://github.com/DePasqualeOrg/swift-transformers-mlx.git
    branch: main
  ArgmaxOSS:
    path: Vendor/argmax-oss-swift
  BuddyGrammarKit:
    path: BuddyGrammarKit
targets:
  BuddyGrammar:
    type: application
    platform: macOS
    sources:
      - path: BuddyGrammar
    dependencies:
      - package: Sparkle
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFaceMLX
        product: MLXLMHuggingFace
      - package: SwiftTransformersMLX
        product: MLXLMTransformers
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar
        INFOPLIST_FILE: BuddyGrammar/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: BuddyGrammar/Support/BuddyGrammar.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: BuddyWrite
        PRODUCT_MODULE_NAME: BuddyGrammar
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - BuddyGrammarTests
  BuddyGrammarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BuddyGrammarTests
    dependencies:
      - target: BuddyGrammar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BuddyWrite.app/Contents/MacOS/BuddyWrite"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BuddyGrammarIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyGrammarIOS
      - path: BuddyGrammar/Assets.xcassets
    dependencies:
      - package: BuddyGrammarKit
      - target: BuddyGrammarKeyboard
        embed: true
      - target: BuddyGrammarLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar
        INFOPLIST_FILE: BuddyGrammarIOS/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: BuddyGrammarIOS/Support/BuddyGrammarIOS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: BuddyGrammar
        PRODUCT_MODULE_NAME: BuddyGrammarIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - BuddyGrammarIOSTests
        - BuddyGrammarIOSUITests
  BuddyGrammarLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyGrammarLiveActivity
    dependencies:
      - package: BuddyGrammarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar.LiveActivity
        INFOPLIST_FILE: BuddyGrammarLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: BuddyGrammarLiveActivity
        PRODUCT_MODULE_NAME: BuddyGrammarLiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  BuddyGrammarKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyGrammarKeyboard
    dependencies:
      - package: BuddyGrammarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar.Keyboard
        INFOPLIST_FILE: BuddyGrammarKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: BuddyGrammarKeyboard/BuddyGrammarKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: BuddyGrammarKeyboard
        PRODUCT_MODULE_NAME: BuddyGrammarKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  BuddyGrammarIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyGrammarIOSTests
      # KeyboardMetrics is defined by the keyboard extension target; compiling
      # this single layout file into the test bundle keeps the metrics tests
      # honest without coupling them to the whole extension.
      - path: BuddyGrammarKeyboard/KeyboardLayoutMetrics.swift
    dependencies:
      - package: BuddyGrammarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar.IOSTests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  BuddyGrammarIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BuddyGrammarIOSUITests
    dependencies:
      - target: BuddyGrammarIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.BuddyGrammar.IOSUITests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
